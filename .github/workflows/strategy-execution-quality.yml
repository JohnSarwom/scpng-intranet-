name: Strategy Execution Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strategy execution regression
        run: node scripts/run-strategy-tests.mjs

      - name: Reject new TypeScript diagnostics
        run: node scripts/check-typescript-baseline.mjs

      - name: Build production bundle
        run: npm run build
